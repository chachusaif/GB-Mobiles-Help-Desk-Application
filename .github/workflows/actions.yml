name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Fresh, isolated virtual machine for every run
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter (if configured)
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Build (if configured)
        run: npm run build --if-present

      - name: Smoke test Express server starts
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 5
          curl --fail http://localhost:3000/ || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
        env:
          PORT: 3000
