<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/register.js" defer></script> <!-- browser code only: server.js runs in Node, never in the page -->
</head>
<body>
    <header>
        <h1>HelpDesk</h1>
    </header>
    <main>
         <section aria-labelledby="login-heading">
      <h2 id="login-heading">Create Account</h2>

      <form id="register-form" action="/register" method="post"> <!-- find out what /login form means and what "action" does-->

        <label for="register-username">Create username</label> <!--changing all the variables from login to register to see if it even matters or if it overlaps during later account verification-->

        <input
          type="text"
          id="register-username"
          name="username"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          required
        >

        <label for="register-password">Create password</label> <!--possibly add another password text box for password verification? -->
        <input
          type="password"
          id="register-password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit" class="button"> <!-- pressing this fires the form's "submit" event, which js/register.js listens for -->
        Create Account</button>

      </form>

      <p id="register-message" aria-live="polite"></p>

      <p>Already have an account? <a href="index.html">Log in</a></p>
    </section>
    </main>

    <footer>
    <p>&copy; 2026 Helpdesk</p>
  </footer>

</body>
</html>
