<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script> <!-- find out if I need this for the register page-->
</head>
<body>

  <header>
    <h1>HelpDesk</h1>
  </header>

  <main>
    <section aria-labelledby="login-heading">
      <h2 id="login-heading">Log in</h2>

      <form id="login-form" action="/login" method="post"> <!-- find out what /login form means and what "action" does-->

        <label for="login-username">Username</label>

        <input
          type="text"
          id="login-username"
          name="username"
          autocomplete="username"
          required
        >

        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <button type="submit">Log in</button> <!-- button for submission form-->
      </form>

      <p id="login-message" aria-live="polite"></p>

      <p>Don't have an account? <a href="register.html">Register</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Helpdesk</p>
  </footer>

</body>
</html>
